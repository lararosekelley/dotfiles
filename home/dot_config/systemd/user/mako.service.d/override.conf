[Service]
# Only in a sway session. Under Plasma (and sway-nested inside it), a
# notification sent before Plasma claims the notification service would
# otherwise start mako in Plasma's place, through D-Bus activation.
ExecCondition=/bin/sh -c 'case "$XDG_CURRENT_DESKTOP" in *sway*) ;; *) exit 1 ;; esac'
