; wob, the on-screen bar for volume and brightness, in the Callie theme
; (https://github.com/greylocklabs/themes). ~/.bin/osd feeds it. Colors are
; RRGGBB or RRGGBBAA. Reference: `man wob.ini`.

timeout = 1000
max = 100
width = 320
height = 32
border_offset = 3
border_size = 2
bar_padding = 3
anchor = bottom center
margin = 96
output_mode = focused

border_color = f08fb8
background_color = 1c1220e6
bar_color = f08fb8

; a muted speaker shows its level in grey
[style.muted]
border_color = 9a8797
bar_color = 9a8797
