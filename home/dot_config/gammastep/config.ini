; gammastep, the sway session's night light, started from session.conf and
; toggled with ~/.bin/night-light. It follows fixed dawn and dusk times rather
; than a location, so none is needed. Reference: `man gammastep`.

[general]
adjustment-method=wayland
temp-day=6500
temp-night=3600
fade=1
dawn-time=06:30-07:30
dusk-time=19:00-20:30
