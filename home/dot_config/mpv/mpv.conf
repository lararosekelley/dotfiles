# mpv, the video player. Reference: `man mpv`, or https://mpv.io/manual/

# decode on the GPU (VA-API on AMD) where it's safe, and render with the newer
# GPU renderer
hwdec=auto-safe
vo=gpu-next

# stay on the last frame instead of closing, and resume where a file was left
keep-open=yes
save-position-on-quit=yes

# streamed URLs (through yt-dlp) at up to the desktop monitor's 1440p
ytdl-format=bestvideo[height<=?1440]+bestaudio/best

screenshot-dir=~/Pictures/Screenshots

# on-screen text in the Callie theme and the sway font
osd-font="IosevkaTerm Nerd Font Propo"
osd-color="#e0d3df"
osd-outline-color="#1c1220"
