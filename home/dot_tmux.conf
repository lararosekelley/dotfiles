# tmux.conf
#
# tmux for sessions that outlive a window, work over SSH, agents, and splits
# inside a terminal; sway tiles the terminals themselves. The bar shows the
# shared status cells, and the second status line the keys for whatever is
# pending. See docs/tmux.md.
# --------

# colors
# Callie's palette, from https://github.com/greylocklabs/themes
# --------

rosewater="#fac5c2"
flamingo="#eaaba8"
pink="#f08fb8"
mauve="#e5aac1"
red="#eaaba8"
maroon="#fac5c2"
peach="#e8d1a8"
yellow="#d6ba86"
green="#9dcca3"
teal="#82cdcd"
sky="#a6e1e1"
sapphire="#a4beef"
blue="#a4beef"
lavendar="#bfd5fd"

white="#e0d3df"
gray="#9a8797"    # bright black, for dim text
bg1="#1c1220"     # the background
surface="#2a1d30" # raised: inactive tabs, popups
border="#3d2c42"  # unfocused borders

cells="~/.local/share/status-cells"

# rounded pill ends (Nerd Font powerline half circles)
cap_l=""
cap_r=""

# general
# --------

set -sg escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# windows are named after the program running in them
setw -g automatic-rename on
set -g set-titles on

set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-kitty:RGB"

# toggle mouse mode with prefix+m (on) and prefix+M (off)
set -g mouse on
bind m set -g mouse on \; display 'Mouse mode: ON'
bind M set -g mouse off \; display 'Mouse mode: OFF'

# | and - for splitting panes, in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# split panes evenly
bind M-1 select-layout even-vertical
bind M-2 select-layout even-horizontal

# reload this file
bind r source-file ~/.tmux.conf \; display 'Reloaded ~/.tmux.conf'

# navigation
# --------

setw -g mode-keys vi

# Switch panes (compatible with neovim config; see https://github.com/christoomey/vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'
# cycle panes on C-g: not C-o (tmux-open owns it in copy-mode-vi), not C-q
# (terminal flow control), not C-n (nvim's completion trigger)
bind-key -n 'C-g' if-shell "$is_vim" 'send-keys C-g' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-g' select-pane -t:.+

# Shift-<arrow> walks windows and sessions, as in herdr and tuios
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n S-Up switch-client -p
bind -n S-Down switch-client -n

# Ctrl-Shift-<arrow> moves the window left or right
bind-key -n C-S-Left swap-window -t -1 \; select-window -t -1
bind-key -n C-S-Right swap-window -t +1 \; select-window -t +1

# theme
# --------

setw -g clock-mode-style 12
setw -g clock-mode-colour "$pink"

set -g message-style "fg=$white,bg=$surface"
set -g mode-style "fg=$bg1,bg=$mauve"
set -g popup-border-style "fg=$pink"
set -g popup-border-lines rounded
set -g menu-border-style "fg=$pink"
set -g menu-border-lines rounded
set -g menu-style "fg=$white,bg=$surface"
set -g menu-selected-style "fg=$bg1,bg=$pink,bold"

# panes are titled with the program running in them
set -g pane-border-status top
set -g pane-border-style "fg=$border"
set -g pane-active-border-style "fg=$pink"
set -g pane-border-format " #{pane_current_command} "

# bar: tabs as pills on the left, status cells on the right, and below it the
# keys for whatever is pending
set -g status-position top
set -g status 2
set -g status-interval 5
set -g status-style "fg=$white,bg=default"
set -g status-left-length 40
set -g status-right-length 160

set -g status-left "#[fg=$mauve]${cap_l}#[bg=$mauve,fg=$bg1,bold] #S #[nobold,bg=default,fg=$mauve]${cap_r} "
setw -g window-status-separator " "
setw -g window-status-format "#[fg=$surface]${cap_l}#[bg=$surface,fg=$white] #I #W#{?window_zoomed_flag, 󰊓,} #[bg=default,fg=$surface]${cap_r}"
setw -g window-status-current-format "#[fg=$pink]${cap_l}#[bg=$pink,fg=$bg1,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[nobold,bg=default,fg=$pink]${cap_r}"
setw -g window-status-bell-style "fg=$yellow"
setw -g window-status-activity-style "fg=$yellow"

set -g status-right "#(sh $cells/pill.sh '$pink' '$bg1' $cells/now-playing.sh) #[fg=$teal]#(sh $cells/cached.sh 1800 $cells/weather.sh) #[fg=$green]#(sh $cells/battery.sh) #[fg=$yellow]#(sh $cells/volume.sh) #[fg=$blue]#(sh $cells/cached.sh 60 $cells/ip.sh) #[fg=$red]󰃰 %a %-I:%M%p "

# The second line is the which-key hint: the prefix keys while Ctrl-b is
# pending, the copy-mode keys in copy mode, and otherwise where to find them.
# Styles are written one per #[] because commas would end a conditional branch.
key="#[fg=$pink]#[bold]"
desc="#[fg=$gray]#[nobold]"
hint_prefix="${key} c${desc} window  ${key}|${desc} split  ${key}-${desc} split  ${key}z${desc} zoom  ${key}x${desc} kill  ${key}s${desc} sessions  ${key}w${desc} windows  ${key}[${desc} copy  ${key}u${desc} urls  ${key}r${desc} reload  ${key}d${desc} detach  ${key}Space${desc} menu  ${key}?${desc} all keys"
hint_copy="${key} v${desc} select  ${key}y${desc} yank  ${key}/${desc} search  ${key}n${desc} next  ${key}C-c${desc} clipboard  ${key}q${desc} quit"
hint_idle="${desc} ${key}C-b${desc} keys  ${key}C-Space${desc} menu  ${key}S-arrows${desc} windows and sessions"
set -g status-format[1] "#[align=left]#{?client_prefix,${hint_prefix},#{?pane_in_mode,${hint_copy},${hint_idle}}}"

# plugins (prefix+I installs, prefix+U updates, prefix+alt+u cleans)
# --------

# battery life
set -g @plugin 'tmux-plugins/tmux-battery'

# persist tmux sessions across restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'glances'

# autosave sessions
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# copy and paste
set -g @plugin 'tmux-plugins/tmux-yank'
bind -T copy-mode    C-c send -X copy-pipe-no-clear "wl-copy"
bind -T copy-mode-vi C-c send -X copy-pipe-no-clear "wl-copy"
set -g @yank_action 'copy-pipe-no-clear'

# urls
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'u'

# better search
set -g @plugin 'tmux-plugins/tmux-copycat'

# open files in browser or related apps
set -g @plugin 'tmux-plugins/tmux-open'

# which-key menu on prefix+Space and C-Space, from
# ~/.config/tmux/plugins/tmux-which-key/config.yaml
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @tmux-which-key-xdg-enable 1

# initialize plugins
run '~/.tmux/plugins/tpm/tpm'
