[Service]
# Indexing is never urgent. Keep it off the desktop's back.
CPUQuota=150%
CPUWeight=20
IOWeight=20
IOSchedulingClass=idle
Nice=19
MemoryHigh=2G
MemoryMax=4G

# On SIGTERM the indexer has to flush the Xapian write handle before exiting,
# which does not fit in Fedora's 45s DefaultTimeoutStopSec on an index this
# size -- so every single restart was overrunning the timeout.
TimeoutStopSec=5min

# Fedora ships /usr/lib/systemd/user/service.d/10-timeout-abort.conf, which
# sets TimeoutStopFailureMode=abort globally: a stop overrun gets SIGABRT plus
# an ~80MB coredump, and /var/lib/systemd/coredump was up to 3GB. Undo that for
# this unit only, so an overrun past TimeoutStopSec is just a SIGKILL. Fedora's
# documented alternative masks the drop-in system-wide and needs root; this is
# scoped and needs neither.
TimeoutStopFailureMode=terminate
