# tuios configuration file
#
# see `tuios list-options` and `tuios keybinds list`; tuios reloads this file
# on save.
# --------

[startup]
tiled = true
daemon = true

# ui
# --------

[appearance]
# converted from the kitty port in https://github.com/greylocklabs/themes
theme = "callie"
# let kitty's background show through
background = "off"
border_focused_color = "accent"

# ctrl+h/j/k/l cross nvim splits and tuios panes
# (https://github.com/Tim4c/tuios-nvim-navigator)
nvim_navigation = true

[appearance.sidebar]
position = "right"
width = 22
sections = "sessions,terminals,agents"

[appearance.sidebar.left]
enabled = true
width = 22
sections = "files,git"

# top bar; workspace names carry their icons (default-session layout.json)
[dock]
right = [
  "transfers",
  "notifications",
  "copy-help",
  "cpu",
  "ram",
  "custom/now-playing",
  "custom/weather",
  "custom/battery",
  "custom/volume",
  "custom/ip",
  "custom/clock",
]

# the active tab is already bold in the accent colour
[dock.tabs]
active_underline = false

[dock.custom.now-playing]
command = "sh ~/.config/tuios/dock/now-playing.sh"
refresh = "5s"
max-width = 28
fg = "bg"
bg = "accent"
bold = true
cap_left = ""
cap_right = ""

[dock.custom.weather]
command = "sh ~/.config/tuios/dock/weather.sh"
fg = "cyan"
refresh = "30m"

[dock.custom.battery]
command = "sh ~/.config/tuios/dock/battery.sh"
fg = "green"
refresh = "60s"

[dock.custom.volume]
command = "sh ~/.config/tuios/dock/volume.sh"
fg = "yellow"
refresh = "2s"

[dock.custom.ip]
command = "sh ~/.config/tuios/dock/ip.sh"
fg = "blue"
refresh = "60s"

# md-calendar-clock, then e.g. "Sun 7:46PM"
[dock.custom.clock]
command = "date '+󰃰 %a %-I:%M%p'"
fg = "red"
refresh = "10s"

[daemon]
resume_agents = "auto"
# hold off sleep while any agent pane works
keep_awake = "agents"

# alerts stay in the tuios dock
[notifications.agent]
notify = false

# keybindings
# --------

[keybindings.global]
# hand ctrl+p back to nvim and shell history
command_palette = ["ctrl+shift+p"]

# shift+left/right walks workspaces, shift+up/down walks sessions
# Bound per mode rather than globally so the inbox keeps shift+arrows.
[keybindings.terminal_mode]
# replaces alt+arrows so readline keeps alt+left/right for word motion
terminal_focus_left = ["ctrl+h"]
terminal_focus_down = ["ctrl+j"]
terminal_focus_up = ["ctrl+k"]
terminal_focus_right = ["ctrl+l"]
prev_workspace = ["shift+left"]
next_workspace = ["shift+right"]
prev_session = ["shift+up"]
next_session = ["shift+down"]
# line scrolling gives shift+up/down to sessions; shift+pgup/pgdown still page
terminal_scroll_up = []
terminal_scroll_down = []

[keybindings.window_management]
prev_workspace = ["shift+left"]
next_workspace = ["shift+right"]
prev_session = ["shift+up", "alt+shift+p"]
next_session = ["shift+down", "alt+shift+n"]

[keybindings.prefix_mode]
# prefix+\ jumps back to the last pane, | still splits
split_vertical = ["|"]
last_pane = ["\\"]

[[keybindings.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "lazygit popup"

# default session (default-session/session.py, opened by `tui` in ~/.functions)
# --------

# prefix+d is tuios's detach, so building takes alt
[[keybindings.command]]
key = "prefix+alt+d"
type = "shell"
command = 'python3 ~/.config/tuios/default-session/session.py apply "$TUIOS_SESSION"'
description = "apply the default workspace/split layout to this session"

[[keybindings.command]]
key = "prefix+ctrl+d"
type = "shell"
command = "python3 ~/.config/tuios/default-session/session.py rehydrate"
description = "relaunch programs in sessions restored as bare shells"

[spotlight]
enabled = false

[debug]
show_key_events = false
