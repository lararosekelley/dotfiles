# herdr configuration file
#
# see https://herdr.dev/docs/config-reference;
# startup layout itself lives in local-plugins/default-session
# --------

# general settings
# --------

onboarding = false

# ui
# --------

[ui]
show_agent_labels_on_pane_borders = true
accent = "#89b4fa"

# makes a window immediately and auto-names it
prompt_new_tab_name = false

# copy on select
mouse_capture = true
copy_on_select = true

# agent panel ordering: "spaces" groups by space, "priority" is the attention queue
agent_panel_sort = "priority"

[theme]
name = "catppuccin"

# sidebar rows (branch and dirty state)
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

# sessions
# --------

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

# keybindings
# --------

[keys]

# ctrl+space (no prefix) opens the session navigator. prefix+g stays as a
# fallback for terminals that swallow the chord. This must live here in [keys]
# -- putting it after the [[keys.command]] blocks below parses as a key of the
# last one, and herdr only says "unknown config key ...; ignoring key".
goto = ["prefix+g", "ctrl+space"]

# shift-left/right move between windows
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]

# | splits side by side, - splits top and bottom
split_vertical = ["prefix+v", "prefix+|"]
split_horizontal = "prefix+minus"
# C-\ jumps back to the last pane

last_pane = "prefix+backslash"

# spaces
# --------

# shift+left/right walks tabs, shift+up/down walks spaces, matching
# how the sidebar stacks them.
previous_workspace = "shift+up"
next_workspace = "shift+down"
switch_workspace = "prefix+shift+1..9"

# agents
# --------

# prefix+a walks the agents that want attention, wherever they live. the indexed
# version needs ctrl+digit, which not every terminal forwards.
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+ctrl+1..9"

# vim navigation via ctrl-j/k/h/l (https://github.com/paulbkim-dev/vim-herdr-navigation)
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# default-session plugin (local-plugins/default-session)
# --------

# prefix+d builds this space, prefix+ctrl+d builds every space that came back
# from a restore as bare shells
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "default-session.apply"
description = "apply the default tab/split layout to this space"

# C-S-left/right swap windows
[[keys.command]]
key = "ctrl+shift+left"
type = "plugin_action"
command = "default-session.tab-move-left"
description = "move tab left"

[[keys.command]]
key = "ctrl+shift+right"
type = "plugin_action"
command = "default-session.tab-move-right"
description = "move tab right"

[[keys.command]]
key = "prefix+="
type = "plugin_action"
command = "default-session.balance"
description = "even out split ratios in this tab"

# prefix+m / prefix+M toggle mouse mode
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "default-session.toggle-mouse"
description = "toggle mouse capture"

# relaunch the programs in every space whose panes came back from a restore as bare shells
[[keys.command]]
key = "prefix+ctrl+d"
type = "plugin_action"
command = "default-session.rehydrate"
description = "relaunch programs in spaces restored as bare shells"

# lazygit
[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"
description = "lazygit popup"
