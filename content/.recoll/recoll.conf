# The system-wide configuration files for recoll are located in:
#   /usr/share/recoll/examples
# The default configuration files are commented, you should take a look
# at them for an explanation of what can be set (you could also take a look
# at the manual instead).
# Values set in this file will override the system-wide values for the file
# with the same name in the central directory. The syntax for setting
# values is identical.

topdirs = ~/Code /run/media/lara/Storage/Dropbox/Files

# KEEP THIS AS A SINGLE ASSIGNMENT!
#
# Patterns are case-sensitive fnmatch against bare file and directory names at
# any depth, so "tmpOutput" prunes test/integration/tmpOutput in every repo
#
# The list is space-separated, so a name that contains a space cannot be
# expressed here -- "Network Trash Folder" and "Temporary Items" have no
# spelling that works, which is why only their no-space siblings are below.
#
# The Mac group is aimed at the Dropbox topdir, which came from macOS:
# ._* alone is ~32k AppleDouble stubs that no handler can parse, so each one
# was costing a failed handler invocation on every pass.
skippedNames+ = target node_modules .git .jj .hg .svn .venv venv __pycache__ \
    .mypy_cache .pytest_cache .ruff_cache .tox .gradle .m2 .cache .ccache \
    .next .nuxt .svelte-kit .turbo .parcel-cache .angular \
    dist build out coverage .terraform vendor Pods DerivedData \
    .cargo .rustup .stack .cabal .direnv result tmp tmpOutput temp \
    extractedFaceDiffBaselines tsc-trace circle-build-artifacts tmp_src_maps \
    higharcConnector draco inference_data_temp \
    test-results playwright-report blob-report storybook-static .storybook-out \
    .nyc_output htmlcov logs pids backups \
    .eslintcache .stylelintcache .serverless .typecheck-perf .nextjs-bundle-base \
    .ipynb_checkpoints wandb runs \
    jspm_packages bower_components lib-cov typings .fusebox .grunt \
    .rpt2_cache .rts2_cache_cjs .rts2_cache_es .rts2_cache_umd .yarn-integrity \
    .eggs develop-eggs sdist wheels __pypackages__ .pyre .pytype .yardoc \
    .vscode-test .idea .zed \
    *worktrees* \
    .env .env.local .env.*.local .secrets tfstate.json tfstate-edited.json \
    ._* .DS_Store .AppleDouble .AppleDB .AppleDesktop .LSOverride .apdisk \
    .Spotlight-V100 .Trashes .TemporaryItems .fseventsd .VolumeIcon.icns \
    .DocumentRevisions-V100 .com.apple.timemachine.donotpresent

# Binary/build outputs: index the name, never crack the contents. Same
# single-assignment rule as skippedNames+ above.
noContentSuffixes+ = .rlib .rmeta .o .a .so .dylib .d .bin .wasm .pdb \
    .class .jar .pyc .pyo .lock .map .min.js .zst .pack .idx \
    .pt .pth .onnx .safetensors .ckpt .h5 .pkl .joblib .tflite

# Cap indexer parallelism (16-core box, leave the desktop responsive).
thrQSizes = 2 2 2
thrTCounts = 1 1 1
